<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Japan de Antaño</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="img/favicon.ico">
</head>
<body>

    <div class="contenedor">
        <div class="contenedor-interno">

            <div class="cabecera">

                <header class="header">
                    <div class="header-logo">
                        <a href="#"><img src="img/logo.png" alt="Japan Tourism"></a>
                    </div>

                    <nav class="header-nav">
                        <ul>
                            <li><a href="#"><i class="fas fa-home"></i> Inicio</a></li>
                            <li><a href="#"><i class="fas fa-map-marked-alt"></i> Rutas</a></li>
                            <li><a href="#"><i class="fas fa-h-square"></i> Hoteles</a></li>
                            <li><a href="#"><i class="fas fa-plane"></i> Vuelos</a></li>
                            <li><a href="#"><i class="fas fa-address-book"></i> Contacto</a></li>
                        </ul>
                    </nav>

                    <div class="header-redes">
                        <a href="#" aria-label="Facebook"><i class="fab fa-facebook-square"></i></a>
                        <a href="#" aria-label="Twitter"><i class="fab fa-twitter"></i></a>
                    </div>
                </header>

                <section class="banner">
                    <div class="banner-contenido">”Disfruta de la experiencia de otros viajeros”</div>
                </section>

            </div>

            <main class="main-content">

                <section class="contenido-izquierda">

                    <div class="articulos-grid">
                        <article class="articulo">.articulo</article>
                        <article class="articulo">.articulo</article>
                        <article class="articulo">.articulo</article>
                        <article class="articulo">.articulo</article>
                    </div>

                    <nav class="navegacion">.navegacion</nav>

                </section>

                <aside class="contenido-derecha">
                    <div class="publicidad">.publicidad</div>
                    <div class="publicidad">.publicidad</div>
                </aside>

            </main>

            <footer class="footer">.pie</footer>

        </div>
    </div>

</body>
</html>
