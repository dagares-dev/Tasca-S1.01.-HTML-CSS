<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Turismo</title>
    <link rel="stylesheet" href="style1.css">
</head>
<body>
    
    <div class="contenedor">
        
        
        <div class="contenedor-interno">
            
            <!-- HEADER -->
            <header class="header">
                <div class="header-logo">.logo</div>
                <nav class="header-nav">.navegadores</nav>
                <div class="header-redes">.social</div>
            </header>

            <!-- BANNER -->
            <section class="banner">
                <div class="banner-contenido">.banner</div>
            </section>

            <!-- CONTENIDO -->
            <main class="main-content">
                
                <!-- IZQUIERDA -->
                <section class="contenido-izquierda">
                    
                    <div class="articulos-grid">
                        <article class="articulo">.articulo</article>
                        <article class="articulo">.articulo</article>
                        <article class="articulo">.articulo</article>
                        <article class="articulo">.articulo</article>
                    </div>
                    
                    <nav class="navegacion">.navegacion</nav>
                    
                </section>
                
                <!-- DERECHA -->
                <aside class="contenido-derecha">
                    <div class="publicidad">.publicidad</div>
                    <div class="publicidad">.publicidad</div>
                </aside>
                
            </main>

            <!-- FOOTER -->
            <footer class="footer">.pie</footer>

        </div>

    </div>

</body>
</html>
